name: Deploy to GitHub Pages and Halo

on:
  push:
    branches: [ main ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: latest
        
    - name: Install dependencies
      run: pnpm install --frozen-lockfile
      
    - name: Build
      run: pnpm run build  # 确保输出目录是 ./dist
      
    # === 部署到 GitHub Pages ===
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact for GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./dist

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        force_orphan: true

    # === 部署到 Halo (测试) ===
    - name: Deploy to Halo Static Pages
      run: |
        npx halo-static-pages-deploy-cli deploy \
          -e ${{ secrets.HALO_ENDPOINT }} \
          -i ${{ secrets.HALO_PROJECT_ID }} \
          -t ${{ secrets.HALO_PAT }} \
          -f ./dist