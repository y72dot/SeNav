name: Deploy to Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: '9'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Deploy via rsync
        run: |
          sudo apt-get install -y sshpass
          rsync -e "sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no" \
            -rltgoDzvO --delete \
            dist/ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/var/www/senav/releases/${{ github.run_id }}/
          sshpass -p '${{ secrets.SSH_PASSWORD }}' ssh -o StrictHostKeyChecking=no \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "ln -sfn /var/www/senav/releases/${{ github.run_id }} /var/www/senav/current && ls -dt /var/www/senav/releases/*/ | tail -n +6 | xargs -r rm -rf && sudo systemctl reload nginx"
